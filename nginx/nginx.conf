server {
    listen 80;
    server_name ${DOMAIN};
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# in upstream variablen: nur _ und kleinbuchstaben

server {
    listen 443 ssl;
    server_name ${DOMAIN};
    ssl_certificate     /etc/letsencrypt/live/micedric.dpdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/micedric.dpdns.org/privkey.pem;

    resolver 10.89.0.1 valid=30s;
    resolver_timeout 5s;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /jenkins {
        proxy_pass http://jenkins:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_intercept_errors on;
        error_page 502 503 504 = @upstream_down;
    }

    location /vue-webtech-frontend {
        set $vue_webtech_frontend_upstream vue-webtech-frontend;
        proxy_pass http://$vue_webtech_frontend_upstream:8001;
        proxy_set_header Host $host;

        proxy_intercept_errors on;
        error_page 502 503 504 = @upstream_down;
    }

    location @upstream_down {
        default_type text/html;
        return 503 '<html><body><h1>Service momentan nicht verfügbar</h1><p>Bitte versuche es später erneut.</p></body></html>';
    }
}