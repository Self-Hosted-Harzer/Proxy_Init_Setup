


# Gemeinsamer HTTP → HTTPS Redirect + ACME-Challenge für alle Subdomains
server {
    listen 80;
    server_name micedric.dpdns.org *.micedric.dpdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# Hauptdomain
server {
    listen 443 ssl;
    server_name micedric.dpdns.org;

    ssl_certificate     /etc/letsencrypt/live/micedric.dpdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/micedric.dpdns.org/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        auth_basic "bauth general";
        auth_basic_user_file /etc/nginx/auth/cedric.htpasswd;

        try_files $uri $uri/ =404;
    }
}




#java api raumbezogenedienste
server {
    listen 443 ssl;
    server_name raum-api.micedric.dpdns.org;

    ssl_certificate     /etc/letsencrypt/live/micedric.dpdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/micedric.dpdns.org/privkey.pem;

    resolver 10.89.0.1 valid=30s;
    resolver_timeout 5s;

    location / {
        set $raumbezogenedienstespring_upstream raumbezogene-dienste-spring;
        proxy_pass http://$raumbezogenedienstespring_upstream:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_intercept_errors on;
        error_page 502 503 504 = @upstream_down;
    }

    location @upstream_down {
        default_type text/html;
        return 503 '<html><body><h1>Service momentan nicht verfügbar</h1><p>Bitte versuche es später erneut.</p></body></html>';
    }
}



# map gehört auf http-Ebene (z.B. in /etc/nginx/nginx.conf im http{}-Block,
# oder in einer per include eingebundenen conf.d-Datei)
map $http_origin $cors_origin {
    default "";
    "~^http://localhost(:[0-9]+)?$" $http_origin;
    "~^https://raum-vue.micedric.dpdns.org$" $http_origin;
}

server {
    listen 443 ssl;
    server_name raum-martin.micedric.dpdns.org;

    ssl_certificate     /etc/letsencrypt/live/micedric.dpdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/micedric.dpdns.org/privkey.pem;

    resolver 10.89.0.1 valid=30s;
    resolver_timeout 5s;

    location / {
        # Falls Martin eigene CORS-Header schickt, hier entfernen
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Credentials;

        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Range' always;
        add_header 'Access-Control-Max-Age' 1728000 always;

        # OPTIONS wird IMMER von nginx beantwortet, erreicht Martin nie
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Range' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Length' 0;
            add_header 'Content-Type' 'text/plain; charset=UTF-8';
            return 204;
        }

        auth_basic "Martin Tiles";
        auth_basic_user_file /etc/nginx/auth/martin.htpasswd;

        set $raumbezogenedienstemartin_upstream raumbezogene-dienste-martin;
        proxy_pass http://$raumbezogenedienstemartin_upstream:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_intercept_errors on;
        error_page 502 503 504 = @upstream_down;
    }

    location @upstream_down {
        default_type text/html;
        return 503 '<html><body><h1>Service momentan nicht verfügbar</h1><p>Bitte versuche es später erneut.</p></body></html>';
    }
}


