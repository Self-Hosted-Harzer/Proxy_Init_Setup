services:
  beszel-hub:
    image: henrygd/beszel:latest
    container_name: beszel-hub
    restart: unless-stopped
    networks:
      - mynet
    environment:
      APP_URL: https://beszel.micedric.dpdns.org:9001
    volumes:
      - ./beszel_data:/beszel_data
      - ./beszel_socket:/beszel_socket
    labels:
      - "traefik.enable=true"

      # Routing / Subdomain
      - "traefik.http.routers.beszel.rule=Host(`beszel.micedric.dpdns.org`)"
      - "traefik.http.routers.beszel.entrypoints=websecure"
      - "traefik.http.routers.beszel.tls.certresolver=myresolver"
      - "traefik.http.routers.beszel.middlewares=beszel-sablier"
      - "traefik.http.services.beszel.loadbalancer.server.port=8090"

      # Sablier: Container darf trotz Stopp im Routing bleiben (Traefik >= v3.6 nötig)
      - "traefik.docker.allownonrunning=true"

      # Sablier-Gruppierung
      - "sablier.enable=true"
      - "sablier.group=beszel"

      # Sablier-Middleware-Konfiguration (Traefik-Plugin)
      - "traefik.http.middlewares.beszel-sablier.plugin.sablier.group=beszel"
      - "traefik.http.middlewares.beszel-sablier.plugin.sablier.sablierUrl=http://sablier:10000"
      - "traefik.http.middlewares.beszel-sablier.plugin.sablier.sessionDuration=60m"
      - "traefik.http.middlewares.beszel-sablier.plugin.sablier.dynamic.displayName=beszel"
      - "traefik.http.middlewares.beszel-sablier.plugin.sablier.dynamic.theme=ghost"
      - "traefik.http.middlewares.beszel-sablier.plugin.sablier.dynamic.refreshFrequency=3s"


  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    networks:
      - mynet
    volumes:
      - ./beszel_agent_data:/var/lib/beszel-agent
      - ./beszel_socket:/beszel_socket
      - /run/user/1000/podman/podman.sock:/run/user/1000/podman/podman.sock:ro
    environment:
      LISTEN: /beszel_socket/beszel.sock
      HUB_URL: http://beszel-hub:8090
      TOKEN: ${BESZEL_TOKEN}
      KEY: ${BESZEL_KEY}
      DOCKER_HOST: "unix:///run/user/1000/podman/podman.sock"  # Wichtig!
    


networks: 
  mynet: 
    external: true