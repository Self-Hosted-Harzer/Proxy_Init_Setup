site_name: "My LabyRinther Game Dev Blog (:"
site_url: https://gameblog.micedric.dpdns.org/

copyright: >-
  © 2026 Cedric Wünsch ·
  <a href="/legal/impressum/">Impressum</a> ·
  <a href="/legal/datenschutz/">Datenschutz</a> ·
  <a href="/legal/lizenz/">Lizenz</a> ·
  <a href="/legal/haftungsausschluss/">Haftungsausschluss</a>

theme:
  name: material
  favicon: assets/favicon.png
  language: de
  font: false
  features: 
    - toc.integrate
  palette:
    - scheme: slate
      primary: deep purple
      accent: lime
      toggle:
        icon: material/weather-sunny
        name: Zum hellen Modus wechseln
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Zum dunklen Modus wechseln
  features:
    - navigation.tabs
    - content.code.copy

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/DEIN-USER/DEIN-REPO
      name: GitHub

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - md_in_html

plugins:
  - search
  - blog:
      blog_dir: .          # index.md ist die Blog-Startseite
      post_date_format: long
      blog_toc: true
  - git-revision-date-localized:
      type: datetime       # Datum + Uhrzeit der letzten Änderung
      timezone: Europe/Berlin
      enable_creation_date: true

nav:
  - Blog: index.md
  - Projekt: project/projekt.md
  - Rechtliches:
    - Impressum: legal/impressum.md
    - Datenschutz: legal/datenschutz.md
    - Lizenz: legal/lizenz.md
    - Haftungsausschluss: legal/haftungsausschluss.md

extra_css:
  - assets/extra_css.css