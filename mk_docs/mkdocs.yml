theme:
  name: material
  font: false
  palette:
    # Dunkles Schema (Beispiel: Slate)
    - scheme: slate
      primary: deep purple      # Header/Farbe (z.B. indigo, teal, red, custom hex)
      accent: lime              # Links, Buttons (z.B. amber, pink, cyan)
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

    # Helles Schema (optional für Toggle)
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/DEIN-USER/DEIN-REPO
      name: GitHub

